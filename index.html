<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Mask Integrity Doctor</title>
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body { font-family: sans-serif; font-size: 12px; color: #eee; background: #242424; }
    #panel { height: 100%; width: 100%; overflow-y: auto; padding: 12px; box-sizing: border-box; overflow-wrap: break-word; }
    h2 { font-size: 17px; margin: 0; }
    h3 { font-size: 12px; color: #bdbdbd; margin: 0 0 6px; font-weight: bold; }
    p { line-height: 1.4; margin: 6px 0; }
    .note { font-size: 11px; color: #bdbdbd; }
    .section { border-top: 1px solid #414141; margin-top: 12px; padding-top: 10px; }
    .row { display: flex; flex-direction: row; align-items: center; }
    .spread { justify-content: space-between; }
    .wrap { flex-wrap: wrap; }
    button { height: 28px; padding: 0 10px; margin: 2px 6px 2px 0; border-radius: 4px; font-size: 12px; }
    button.primary { background: #3578bb; color: #fff; height: 32px; padding: 0 18px; font-weight: bold; }
    .showrow { margin-top: 6px; }
    .showchip { display: block; box-sizing: border-box; max-width: 100%; margin: 4px 0 0; padding: 4px 10px; border-radius: 12px; background: #4a4a4a; color: #fff; font-size: 11px; line-height: 1.35; overflow-wrap: anywhere; word-break: break-all; }
    button.small { height: 22px; padding: 0 8px; font-size: 11px; margin: 0 0 0 6px; }
    .seg { margin: 2px 0 2px 6px; padding: 3px 10px; border-radius: 12px; border: 1px solid #6a6a6a; color: #ddd; font-size: 11px; }
    .seg.on { background: #3578bb; border-color: #3578bb; color: #fff; font-weight: bold; }
    #scanButton { margin-top: 8px; }

    #status { margin: 10px 0 6px; font-weight: bold; line-height: 1.4; font-size: 13px; }
    #status.badge { display: inline-block; font-size: 16px; padding: 6px 12px; border-radius: 6px; color: #111; }
    .tone-OK { background: #66d980; }
    .tone-WARN { background: #ffc74d; }
    .tone-BAD { background: #ff6b6b; }
    .tone-INFO { background: #d9d9d9; }

    .cards { display: flex; flex-direction: row; flex-wrap: wrap; margin: 6px 0; }
    .card { flex: 1; min-width: 70px; margin: 0 6px 6px 0; padding: 6px 8px; border-radius: 6px; background: #303030; border-left: 4px solid #777; }
    .card .num { font-size: 20px; font-weight: bold; }
    .card .lbl { font-size: 11px; color: #ccc; }
    .card.c-masked { border-color: #66d980; }
    .card.c-unmasked { border-color: #8a8a8a; }
    .card.c-unknown { border-color: #ffc74d; }
    .card.c-issues { border-color: #ff6b6b; }

    .finding { background: #303030; padding: 8px; margin: 6px 0; border-radius: 4px; border-left: 4px solid #8a8a8a; line-height: 1.45; }
    .finding.sev-FAIL { border-color: #ff6b6b; }
    .finding.sev-WARN { border-color: #ffc74d; }
    .finding.sev-UNKNOWN { border-color: #d9d9d9; }
    .finding.sev-INFO { border-color: #66d980; }
    .chip { display: inline-block; font-size: 10px; font-weight: bold; padding: 1px 6px; border-radius: 8px; color: #111; margin-right: 6px; }
    .chip.sev-FAIL { background: #ff6b6b; } .chip.sev-WARN { background: #ffc74d; }
    .chip.sev-UNKNOWN { background: #d9d9d9; } .chip.sev-INFO { background: #66d980; }
    .chip.m-yes { background: #66d980; } .chip.m-no { background: #8a8a8a; color: #fff; } .chip.m-unknown { background: #ffc74d; }
    .chip.tag { background: #555; color: #eee; }

    .seq { margin: 6px 0 10px; }
    .seqname { font-size: 11px; color: #ccc; margin-bottom: 4px; }
    .track { display: flex; flex-direction: row; align-items: center; height: 22px; margin-bottom: 3px; }
    .tlabel { width: 28px; font-size: 11px; color: #bbb; }
    .lane { flex: 1; position: relative; height: 20px; background: #1b1b1b; border-radius: 3px; }
    .lane.hidden { opacity: 0.45; }
    .block { position: absolute; top: 2px; height: 16px; border-radius: 3px; box-sizing: border-box; overflow: hidden; font-size: 10px; line-height: 16px; padding: 0 3px; color: #111; white-space: nowrap; }
    .block.m-yes { background: #66d980; } .block.m-no { background: #6d6d6d; color: #eee; } .block.m-unknown { background: #ffc74d; }
    .block.issue { border: 2px solid #ff6b6b; line-height: 12px; }
    .block.disabled { opacity: 0.5; }
    .block.sel, .cliprow.sel { outline: 2px solid #8ec5ff; }
    .legend { font-size: 10px; color: #bbb; margin-top: 2px; }
    .dot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin: 0 4px 0 8px; }

    .cliprow { display: flex; flex-direction: row; align-items: center; background: #2d2d2d; padding: 5px 6px; margin: 3px 0; border-radius: 4px; }
    .cliprow .grow { flex: 1; min-width: 0; }
    .cliprow .cname { font-weight: bold; }
    .cliprow .cmeta { font-size: 11px; color: #bbb; }
    #previewStatus:empty, #apiLine:empty { display: none; }
    #previewStatus { font-size: 11px; color: #8ec5ff; margin: 4px 0; }
    #output { width: 100%; height: 200px; box-sizing: border-box; font-family: monospace; font-size: 11px; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <div id="panel">
    <div class="row spread">
      <h2 data-i18n="title">Mask Integrity Doctor</h2>
      <button id="langButton" data-i18n="btn_lang">English</button>
    </div>
    <p class="note" data-i18n="intro"></p>

    <div class="row wrap">
      <span class="note" data-i18n="scope_label"></span>
      <div class="seg scope on" data-scope="active" data-i18n="scope_active"></div>
      <div class="seg scope" data-scope="all" data-i18n="scope_all"></div>
    </div>
    <div class="row">
      <sp-button id="scanButton" variant="cta" data-i18n="btn_scan"></sp-button>
    </div>

    <div id="status"></div>
    <div id="previewStatus"></div>

    <div id="results" hidden>
      <div class="cards">
        <div class="card c-masked"><div class="num" id="nMasked">0</div><div class="lbl" data-i18n="card_masked"></div></div>
        <div class="card c-unmasked"><div class="num" id="nUnmasked">0</div><div class="lbl" data-i18n="card_unmasked"></div></div>
        <div class="card c-unknown"><div class="num" id="nUnknown">0</div><div class="lbl" data-i18n="card_unknown"></div></div>
        <div class="card c-issues"><div class="num" id="nIssues">0</div><div class="lbl" data-i18n="card_issues"></div></div>
      </div>

      <div class="section">
        <h3 data-i18n="sec_findings"></h3>
        <div id="findings"></div>
      </div>

      <div class="section">
        <h3 data-i18n="sec_timeline"></h3>
        <p class="note" data-i18n="hint_preview"></p>
        <div id="timeline"></div>
        <div class="legend">
          <span class="dot tone-OK"></span><span data-i18n="legend_masked"></span>
          <span class="dot" style="background:#6d6d6d"></span><span data-i18n="legend_unmasked"></span>
          <span class="dot tone-WARN"></span><span data-i18n="legend_unknown"></span>
          <span class="dot" style="border:2px solid #ff6b6b; box-sizing:border-box"></span><span data-i18n="legend_issue"></span>
        </div>
      </div>

      <div class="section">
        <div class="row spread wrap">
          <h3 data-i18n="sec_clips"></h3>
          <div class="row">
            <div class="seg filter on" data-filter="all" data-i18n="filter_all"></div>
            <div class="seg filter" data-filter="masked" data-i18n="filter_masked"></div>
            <div class="seg filter" data-filter="issues" data-i18n="filter_issues"></div>
          </div>
        </div>
        <div id="clips"></div>
      </div>
    </div>

    <div class="section">
      <h3 data-i18n="sec_advanced"></h3>
      <div class="row wrap">
        <button id="probeButton" data-i18n="btn_probe"></button>
        <button id="saveButton" data-i18n="btn_save" disabled></button>
        <button id="jsonButton" data-i18n="btn_json"></button>
      </div>
      <p id="apiLine" class="note"></p>
      <div id="jsonBox" hidden>
        <p class="note" data-i18n="json_label"></p>
        <textarea id="output" readonly></textarea>
      </div>
    </div>
  </div>
  <script src="index.js"></script>
</body>
</html>
